services:
  # ============================================
  # RabbitMQ - Message Broker
  # Recibe mensajes de la API y los encola para el Worker
  # Puerto 5672: AMQP (comunicación interna)
  # Puerto 15672: UI de administración (rabbitmq_management)
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: iot_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # PostgreSQL - Base de datos
  # Almacena los datos de sensores procesados por el Worker
  # Puerto 5432 interno, expuesto como 5433 para evitar conflictos
  # ============================================
  postgres:
    image: postgres:15
    container_name: iot_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: iot_project
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ============================================
  # API Flask - Recebe datos de sensores
  # Endpoints:
  #   POST /api/sensor-data -> encola a RabbitMQ, retorna 202
  #   GET /health -> para HAProxy health checks
  # Puerto 5000
  # ============================================
  api:
    build: ./api
    container_name: iot_api
    ports:
      - "5000:5000"
    environment:
      - USE_LOCAL_ENV=true
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy

  # ============================================
  # Worker - Procesa mensajes de RabbitMQ
  # Consume de la cola y escribe en PostgreSQL
  # No expone puertos, solo se conecta a RabbitMQ y Postgres
  # ============================================
  worker:
    build: ./worker
    container_name: iot_worker
    environment:
      - USE_LOCAL_ENV=true
      - RABBITMQ_HOST=rabbitmq
      - POSTGRES_HOST=postgres
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_started

volumes:
  # Volumen persistente para PostgreSQL
  postgres_data: